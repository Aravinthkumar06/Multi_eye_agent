services:
  - type: web
    name: multiview-agent-backend
    plan: free
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health

  - type: web
    name: multiview-agent-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npx vite build --config vite.config.render.ts
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        value: https://multiview-agent-backend.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
